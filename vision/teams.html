<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Як бачать світ коти, собаки та коні</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #1f1f1f;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .meeting-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        .meeting-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .meeting-title {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            color: #ffffff;
        }
        .meeting-subtitle {
            font-size: 14px;
            color: #8a8a8a;
            margin-top: 8px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            flex: 1;
            max-height: 70vh;
            width: 100%;
            box-sizing: border-box;
        }
        .participant {
            background: #2d2d2d;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            aspect-ratio: 4/3;
            width: 100%;
            height: 100%;
            min-height: 0;
        }
        .participant-video {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .participant canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            border: none;
            margin: 0;
            padding: 0;
        }
        .participant-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            padding: 16px;
            background: #2d2d2d;
            border-radius: 8px;
        }
        .control-button {
            background: #404040;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .control-button:hover {
            background: #505050;
        }
        .control-button.active {
            background: #0078d4;
        }
        .hidden {
            display: none !important;
        }
        .disclaimer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 8px 16px;
            font-size: 12px;
            text-align: center;
            border-top: 1px solid #333;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .edge-toggle {
            position: absolute;
            top: 16px;
            right: 20px;
            z-index: 10;
        }
        .edge-toggle button {
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: 1px solid #555;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .edge-toggle button:hover {
            background: rgba(0,0,0,0.75);
        }
        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(2, 1fr);
                gap: 8px;
            }
            .meeting-container {
                padding: 8px;
            }
        }
        
        @media (max-width: 480px) {
            .video-grid {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(4, 1fr);
                gap: 6px;
                max-height: 80vh;
            }
            .participant {
                aspect-ratio: 16/9;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="meeting-container">
        <div class="edge-toggle">
            <button id="edgeModeBtn" title="Toggle edge fill mode">Edges: Content</button>
            <button id="zoomModeBtn" title="Toggle human zoom">Zoom: On</button>
        </div>
        <div class="meeting-header">
            <h1 class="meeting-title">Колгосп тварин</h1>
            <p class="meeting-subtitle">Подивіться, як по-різному сприймають світ коти, собаки та коні</p>
        </div>
        
        <div class="video-grid">
            <div class="participant">
                <div class="participant-video">
                    <canvas id="humanView"></canvas>
                </div>
                <div class="participant-label">Ви (людина)</div>
            </div>
            <div class="participant">
                <div class="participant-video">
                    <canvas id="dogView"></canvas>
                </div>
                <div class="participant-label">Патрон</div>
            </div>
            <div class="participant">
                <div class="participant-video">
                    <canvas id="catView"></canvas>
                </div>
                <div class="participant-label">Чіл</div>
            </div>
            <div class="participant">
                <div class="participant-video">
                    <canvas id="horseView"></canvas>

                <div class="participant-label">Бо Джек</div>
        </div>
        </div>
        
    </div>
